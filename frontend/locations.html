<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Locations - Opentrace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">Opentrace</div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/persons.html">Persons</a>
      <a href="/locations.html" aria-current="page">Locations</a>
      <a href="/events.html">Events</a>
      <a href="/sources.html">Sources</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main class="container page-container">
    <h2>Locations</h2>
    <form id="locationsSearchForm" class="search-form" action="/api/locations/search" method="get">
      <input id="locationsQuery" name="q" type="search" placeholder="Search by place name" autocomplete="off" required />
      <button type="submit">Search</button>
    </form>

    <div id="locationsStatus" class="status" aria-live="polite">Search for a location to see results.</div>
    <div id="locationsResults" class="results"></div>
  </main>

  <footer class="site-footer">Data from NamUs, Interpol, Charley Project</footer>
  <script src="/static/app.js"></script>
</body>
</html>
