<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Locations - Opentrace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">Opentrace</div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/persons.html">Persons</a>
      <a href="/locations.html" aria-current="page">Locations</a>
      <a href="/events.html">Events</a>
      <a href="/sources.html">Sources</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main class="container page-container">
    <h2>Locations</h2>
    <form id="locationsSearchForm" class="search-form">
      <input id="locationsQuery" type="search" placeholder="Search by place name" autocomplete="off" required />
      <button type="submit">Search</button>
    </form>

    <div id="locationsStatus" class="status" aria-live="polite">Loading locations...</div>
    <div id="locationsResults" class="results"></div>
  </main>

  <footer class="site-footer">Data from NamUs, Interpol, Charley Project</footer>
  <script src="/static/app.js"></script>
  <script>
    // Auto-load all locations on page init
    document.addEventListener('DOMContentLoaded', async () => {
      const locationsResults = document.getElementById('locationsResults');
      const locationsStatus = document.getElementById('locationsStatus');
      if (!locationsResults) return;
      
      locationsStatus.textContent = 'Loading locations...';
      locationsResults.innerHTML = '';
      try {
        const payload = await fetchJson('/api/locations?limit=500');
        if (!payload.length) {
          locationsStatus.textContent = 'No locations found.';
          return;
        }
        locationsStatus.textContent = '';
        locationsResults.innerHTML = payload.map(loc => {
          const locId = encodeURIComponent(loc.location_id);
          return `
            <article class="card">
              <span class="card-id">${escapeHtml(humanId(loc.location_id))}</span>
              <h3>${escapeHtml(loc.display_name)}</h3>
              <p class="meta">${escapeHtml(loc.canonical_name)}</p>
              <p><strong>Type:</strong> ${escapeHtml(loc.location_type)}</p>
              <p><strong>Coords:</strong> ${loc.latitude}, ${loc.longitude}</p>
              <p class="meta">Confidence: ${loc.confidence_score}</p>
              <p><a href="/location-detail.html?id=${locId}">View details</a></p>
            </article>
          `;
        }).join('');
      } catch (err) {
        locationsStatus.textContent = 'Failed to load locations — try searching.';
      }
    });
  </script>
</body>
</html>
