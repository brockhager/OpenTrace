<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Opentrace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">Opentrace</div>
  </header>

  <main class="container">
    <p class="hint">Search verified missing persons records — <strong>Try: "Michael Johnson" or "California"</strong></p>
    <form id="searchForm" class="search-form" action="/search" method="get">
      <input id="query" name="q" type="search" placeholder="Search names, e.g. 'Michael Johnson'" autocomplete="off" autofocus />
      <button type="submit">Search</button>
      <a class="admin-link" href="/admin.html">Moderator Login</a>
    </form>

    <div id="status" class="status" aria-live="polite">No results yet — Try: "Michael Johnson" or "California"</div>
    <div id="results" class="results"></div>
  </main>

  <footer class="site-footer">Data from NamUs, Interpol, Charley Project</footer>

  <script src="/static/app.js"></script>
</body>
</html>
