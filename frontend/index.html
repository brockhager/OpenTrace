<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Opentrace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <div class="logo">Opentrace</div>
    <nav class="nav-links">
      <a href="/persons.html">Persons</a>
      <a href="/locations.html">Locations</a>
      <a href="/events.html">Events</a>
      <a href="/sources.html">Sources</a>
      <a href="/admin.html">Admin</a>
    </nav>
    
    <form id="searchForm" class="search-form">
      <input id="query" type="search" placeholder="Try: Michael Johnson or California" autocomplete="off" autofocus />
      <button type="submit">Search</button>
    </form>
    
    <!-- Location search controls -->
    <div class="location-search">
      <div class="location-input-group">
        <input id="location" type="text" placeholder="Location (optional)" autocomplete="off" />
        <input id="radius" type="number" placeholder="Radius (km)" min="1" max="500" value="50" />
        <button id="useLocation" type="button">Use my location</button>
        <button id="clearLocation" type="button">Clear</button>
      </div>
    </div>
    
    <div class="admin-link-container">
      <a class="admin-link" href="/admin.html">Moderator Login</a>
    </div>

    <div id="status" class="status" aria-live="polite">No results yet — Try: "Michael Johnson" or "California"</div>
    <div id="results" class="results"></div>
    
    <div class="suggested-searches">
      <p><strong>Not sure what to search?</strong> Try these:</p>
      <div class="suggestion-links">
        <button type="button" class="suggestion-link" data-query="Michael Johnson">Michael Johnson</button>
        <button type="button" class="suggestion-link" data-query="California">California</button>
        <button type="button" class="suggestion-link" data-query="Los Angeles">Los Angeles</button>
        <button type="button" class="suggestion-link" data-query="Smith">Smith</button>
        <button type="button" class="suggestion-link" data-query="Texas">Texas</button>
        <button type="button" class="suggestion-link" data-query="New York">New York</button>
        <button type="button" class="suggestion-link" data-query="Florida">Florida</button>
        <button type="button" class="suggestion-link" data-query="missing">Status: Missing</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">Data from NamUs, Interpol, Charley Project</footer>

  <script src="/static/app.js"></script>
</body>
</html>
