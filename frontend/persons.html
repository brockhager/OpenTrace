<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Persons - Opentrace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">Opentrace</div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/persons.html" aria-current="page">Persons</a>
      <a href="/locations.html">Locations</a>
      <a href="/events.html">Events</a>
      <a href="/sources.html">Sources</a>
      <a href="/admin.html">Admin</a>
    </nav>

  <main class="container page-container">
    <h2>Persons</h2>
    <form id="personsSearchForm" class="search-form">
      <input id="personsQuery" type="search" placeholder="Search by name" autocomplete="off" />
      <input id="personsLocation" type="search" placeholder="Location (optional)" autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <div id="personsStatus" class="status" aria-live="polite">Search confirmed profiles.</div>
    <div id="personsResults" class="results"></div>
  </main>

  <footer class="site-footer">Data from NamUs, Interpol, Charley Project</footer>
  <script src="/static/app.js"></script>
