<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moderator Login - Opentrace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <div class="logo">Opentrace</div>
    
    <div id="loginSection">
      <h2>Moderator Login</h2>
      <form id="loginForm" class="login-form">
        <label>Email <input id="email" type="email" required /></label>
        <label>Password <input id="password" type="password" required /></label>
        <button type="submit">Sign in</button>
      </form>
      <div id="loginStatus" class="status" aria-live="polite"></div>
    </div>

    <section id="reviewSection" style="display:none;">
      <h3>Unconfirmed Profiles</h3>
      <div id="profiles"></div>
    </section>
  </main>

  <footer class="site-footer">Data from NamUs, Interpol, Charley Project</footer>

  <script src="/static/app.js"></script>
</body>
</html>
